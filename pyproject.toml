[project]
name = "tang-discord"
version = "2.0.0"
description = "Tang — Discord AI chat bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"discord.py>=2.4.0",
	"ddgs>=8.1.1",
	"openai>=1.50.0",
	"python-dotenv>=1.0.1",
	"pyyaml>=6.0.0",
	"rapidfuzz>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
