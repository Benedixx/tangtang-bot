[project]
name = "tang-discord"
version = "0.2.0"
description = "Tang — Discord AI chat bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"discord.py>=2.4.0",
	"ddgs>=8.1.1",
	"openai>=1.50.0",
	"python-dotenv>=1.0.1",
	"beautifulsoup4>=4.12.0",
	"requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
